services:
  materials:  # Ваш Django-сервис (замените на реальное имя, если отличается)
    build: .  # Использует Dockerfile из текущей директории
    ports:
      - "8000:8000"  # Проброс порта
    volumes:
      - .:/app  # Монтируем код для разработки
    environment:
      - DJANGO_SETTINGS_MODULE=myproject.settings  # Укажите ваш модуль настроек
      - DB_NAME=mydb  # Добавьте переменные для БД
      - DB_USER=user
      - DB_PASSWORD=password
    depends_on:
      - db_mypedia  # Зависимость от БД

  db_mypedia:  # Сервис базы данных (PostgreSQL)
    image: postgres:15
    environment:
      POSTGRES_DB: mydb
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: